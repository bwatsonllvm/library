name: Auto Sync - Papers and Blogs

run-name: Sync blogs, papers, and canonical collation

on:
  workflow_dispatch:
    inputs:
      llvm_blog_ref:
        description: "llvm-blog-www ref to sync."
        required: false
        default: "main"
        type: string
      openalex_max_pages_per_keyword:
        description: "OpenAlex keyword page cap."
        required: false
        default: "5"
        type: string
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: library-papers-sync-bot
  cancel-in-progress: true

jobs:
  sync-papers:
    name: Sync papers/blogs and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LLVM_BLOG_REF: ${{ github.event.inputs.llvm_blog_ref || 'main' }}
      OPENALEX_MAX_PAGES_PER_KEYWORD: ${{ github.event.inputs.openalex_max_pages_per_keyword || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run papers automation
        id: content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/run-library-automation.sh papers-sync

      - name: Create Pull Request
        if: steps.content.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: library/automated-sync-papers-update
          delete-branch: true
          commit-message: "Library papers sync (blogs, papers)"
          title: "Library papers sync (blogs, papers)"
          body: |
            Automated papers and blogs sync.

            This PR:
            - syncs LLVM blog posts from `llvm-blog-www`
            - refreshes OpenAlex-discovered papers
            - rebuilds the canonical papers collation
            - backfills direct paper PDF links via OpenAlex + Unpaywall
            - syncs MLIR subproject talks/publications used by shared views
            - rebuilds `updates/index.json`
            - regenerates viewer artifacts
            - validates the library bundle
