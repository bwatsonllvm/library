name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install quality tooling
        run: python3 -m pip install --upgrade pip ruff
      - name: Run code quality checks
        run: bash scripts/validate-code-quality.sh
      - name: Validate bundle
        run: scripts/validate-library-bundle.sh
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Detail pages smoke test
        env:
          REQUIRE_DETAIL_SMOKE: "1"
        run: node --test tests/detail-pages-smoke.test.cjs
      - name: Prepare site bundle
        run: |
          rm -rf _site
          mkdir -p _site/papers _site/devmtg
          cp index.html work.html _site/
          cp -R talks blogs people mlir sub-projects about updates css js images _site/
          rsync -a --exclude '.cache/' papers/ _site/papers/
          cp -R devmtg/events _site/devmtg/
          test -f _site/mlir/index.html
          test -f _site/mlir/talks/index.html
          test -f _site/mlir/talks/talk.html
          test -f _site/mlir/pubs/index.html
          test -f _site/sub-projects/index.html
          test -f _site/sub-projects/mlir/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
