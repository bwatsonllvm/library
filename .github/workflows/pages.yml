name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install quality tooling
        run: python3 -m pip install --upgrade pip ruff
      - name: Run library validation
        run: scripts/run-library-automation.sh validate
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Detail pages smoke test
        env:
          REQUIRE_DETAIL_SMOKE: "1"
        run: node --test tests/detail-pages-smoke.test.cjs
      - name: Prepare site bundle
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: scripts/run-library-automation.sh prepare-pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
