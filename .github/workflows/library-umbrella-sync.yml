name: Auto Sync - devmtg Talks

run-name: Sync llvm-www/devmtg talks

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - llvm-www-pr-approved

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: library-talks-sync-bot
  cancel-in-progress: true

jobs:
  sync-talks:
    name: Sync llvm-www/devmtg talks and open PR
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.repo == 'llvm/llvm-www'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync talks/slides/videos from llvm-www/devmtg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync-devmtg-from-llvm-www.py \
            --events-dir devmtg/events \
            --manifest devmtg/events/index.json \
            --github-token "${GITHUB_TOKEN}"

      - name: Sanitize URL-bearing fields
        run: |
          python3 scripts/sanitize-library-urls.py --repo-root .

      - name: Detect content changes
        id: content
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Build updates log
        if: steps.content.outputs.has_changes == 'true'
        run: |
          python3 scripts/build-update-log.py \
            --repo-root . \
            --log-json updates/index.json

      - name: Build viewer artifacts
        if: steps.content.outputs.has_changes == 'true'
        run: |
          scripts/build-viewer-artifacts.sh

      - name: Validate bundle
        if: steps.content.outputs.has_changes == 'true'
        run: |
          scripts/validate-library-bundle.sh

      - name: Create Pull Request
        if: steps.content.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: library/automated-sync-talks-update
          delete-branch: true
          commit-message: "Library talks sync (devmtg)"
          title: "Library talks sync (devmtg)"
          body: |
            Automated `llvm-www/devmtg` talk sync.

            Trigger:
            - event: `${{ github.event_name }}`
            - source repo: `${{ github.event.client_payload.repo }}`
            - llvm-www PR: `${{ github.event.client_payload.pr_number }}`
            - review state: `${{ github.event.client_payload.review_state }}`

            This PR:
            - syncs talks, slides, and video metadata from `llvm-www/devmtg`
            - rebuilds `updates/index.json`
            - regenerates viewer artifacts
            - validates the library bundle
