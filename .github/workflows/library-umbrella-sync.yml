name: Auto Sync - devmtg Talks

run-name: Sync llvm-www/devmtg talks

on:
  workflow_dispatch:
    inputs:
      llvm_www_ref:
        description: "llvm-www ref to sync."
        required: false
        default: "main"
        type: string
      meeting_slug:
        description: "Optional devmtg meeting slug to sync, for example 2026-04."
        required: false
        type: string
  repository_dispatch:
    types:
      - llvm-www-pr-approved

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: library-talks-sync-bot
  cancel-in-progress: true

jobs:
  sync-talks:
    name: Sync llvm-www/devmtg talks and open PR
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.repo == 'llvm/llvm-www'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LLVM_WWW_REPO: ${{ github.event.client_payload.repo || 'llvm/llvm-www' }}
      LLVM_WWW_REF: ${{ github.event.inputs.llvm_www_ref || github.event.client_payload.ref || github.event.client_payload.head_sha || 'main' }}
      DEVMTG_ONLY_SLUG: ${{ github.event.inputs.meeting_slug || github.event.client_payload.meeting_slug || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run talks automation
        id: content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/run-library-automation.sh talks-sync

      - name: Create Pull Request
        if: steps.content.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: library/automated-sync-talks-update
          delete-branch: true
          commit-message: "Library talks sync (devmtg)"
          title: "Library talks sync (devmtg)"
          body: |
            Automated `llvm-www/devmtg` talk sync.

            Trigger:
            - event: `${{ github.event_name }}`
            - source repo: `${{ github.event.client_payload.repo }}`
            - llvm-www PR: `${{ github.event.client_payload.pr_number }}`
            - review state: `${{ github.event.client_payload.review_state }}`
            - source ref: `${{ env.LLVM_WWW_REF }}`
            - meeting slug: `${{ env.DEVMTG_ONLY_SLUG }}`

            This PR:
            - syncs talks, slides, and video metadata from `llvm-www/devmtg`
            - syncs MLIR subproject talks/publications used by shared views
            - rebuilds `updates/index.json`
            - regenerates viewer artifacts
            - validates the library bundle
