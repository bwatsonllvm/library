name: Manual Paper Intake -> Pull Request

run-name: Manual paper intake

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source URL. The workflow can auto-extract metadata from this link."
        required: false
        type: string
      paper_json:
        description: "Optional full paper JSON payload. Merged after source_url extraction."
        required: false
        type: string
      overrides_json:
        description: "Optional JSON overrides. Merged last."
        required: false
        type: string
      base_ref:
        description: "Base branch/ref to target."
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manual-paper-intake
  cancel-in-progress: false

jobs:
  add-paper:
    name: Add manual paper and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run manual paper automation
        id: content
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          PAPER_JSON: ${{ inputs.paper_json }}
          OVERRIDES_JSON: ${{ inputs.overrides_json }}
        run: scripts/run-library-automation.sh manual-paper

      - name: Create Pull Request
        if: steps.content.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ inputs.base_ref }}
          branch: library/manual-paper-intake-${{ github.run_id }}
          delete-branch: true
          commit-message: "Add manual paper record via workflow"
          title: "Add manual paper record"
          body: |
            Automated manual paper intake.

            This PR was generated by `.github/workflows/manual-paper-pr.yml`.
            It validates and appends one record into `papers/manual-added-papers.json` from workflow inputs,
            rebuilds `updates/index.json`, regenerates viewer artifacts, and runs `scripts/validate-library-bundle.sh`.
